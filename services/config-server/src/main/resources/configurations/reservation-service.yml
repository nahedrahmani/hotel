server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:file:./data/reservationdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hotel}
    password: ${RABBITMQ_PASS:hotel}
    listener:
      simple:
        auto-startup: false      # don't block startup if RabbitMQ is unavailable
    template:
      retry:
        enabled: true
        initial-interval: 2000
        max-attempts: 3

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@hotel.example}
    password: ${MAIL_PASSWORD:}
    properties:
      # Off for the local Mailpit; on for a real SMTP server (set in .env)
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

management:
  health:
    rabbit:
      enabled: false             # don't report RabbitMQ in health endpoint

notification:
  from: ${MAIL_FROM:noreply@hotel.example}
  enabled: ${MAIL_ENABLED:false}
