server:
  port: 8087

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_REPLACE_ME}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_REPLACE_ME}
  currency: ${STRIPE_CURRENCY:tnd}

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8889/eureka
