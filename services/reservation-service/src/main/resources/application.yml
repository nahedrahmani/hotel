spring:
  application:
    name: reservation-service
  config:
    import: optional:configserver:http://localhost:8888
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9999/realms/hotel}
  h2:
    console:
      enabled: false
  datasource:
    url: jdbc:h2:file:./data/reservationdb
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  cloud:
    config:
      discovery:
        enabled: false

server:
  port: 8083
  error:
    include-message: always
    include-binding-errors: always

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: "health,info"

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8889/eureka

# Keycloak service account for calls to chambre-service / payment-service.
# The default is the development secret from keycloak/hotel-realm.json; override it outside dev.
service-auth:
  token-uri: ${SERVICE_AUTH_TOKEN_URI:http://localhost:9999/realms/hotel/protocol/openid-connect/token}
  client-id: reservation-service
  client-secret: ${SERVICE_AUTH_CLIENT_SECRET:7cc8fef7d6519c8c6c91f95f1b3a08c14016fbc28d4f568f}
