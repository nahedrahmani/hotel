spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:http://localhost:8888
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9999/realms/hotel}
  datasource:
    url: jdbc:h2:file:./data/paymentdb
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

server:
  port: 8087

konnect:
  api-key: ${KONNECT_API_KEY:}
  wallet-id: ${KONNECT_WALLET_ID:}
  base-url: ${KONNECT_BASE_URL:https://api.sandbox.konnect.network/api/v2}
  return-url: ${KONNECT_RETURN_URL:http://localhost:5173/dashboard/mes-reservations}
  webhook-url: ${KONNECT_WEBHOOK_URL:}
  # live: Konnect's real payment page; simulation: the app's own page, for demos
  mode: ${KONNECT_MODE:live}
  simulation-url: ${KONNECT_SIMULATION_URL:http://localhost:5173/dashboard/paiement-simulation}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8889/eureka
