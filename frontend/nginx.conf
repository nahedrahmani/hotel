server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Built JS/CSS have a content hash in their name, so they can be cached for good.
    # A missing file must be a real 404: falling back to index.html would hand the
    # browser HTML in place of a script and leave a blank page after a redeploy.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always revalidate the entry page so a new build's script names are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
