name: hotel

# Start order: infrastructure first → then business services → then frontend
# Usage: docker compose up --build

# ─── Shared settings ─────────────────────────────────────────────────────────
# The services' own application.yml files point at localhost (for running from
# the IDE). Inside Docker, localhost is the container itself, so these
# variables redirect them to the other containers by service name.

x-spring-env: &spring-env
  # Required, not optional: a service that starts before the config server would run without
  # its config (the gateway with no routes, H2 without credentials). It exits instead and
  # Docker restarts it until the config server answers.
  SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
  # JSON keeps the case of "defaultZone" (a plain env var would lowercase it).
  # preferIpAddress makes services register their container IP, not "localhost".
  SPRING_APPLICATION_JSON: '{"eureka":{"client":{"serviceUrl":{"defaultZone":"http://discovery-service:8889/eureka/"}},"instance":{"preferIpAddress":true}}}'
  # Tokens are issued to the browser as http://localhost:9999 (KC_HOSTNAME_URL),
  # so that is the issuer to check; signing keys are fetched over the Docker network.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: http://localhost:9999/realms/hotel
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/hotel/protocol/openid-connect/certs
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
  # The hotel's clock: "today", check-in times and clock-ins are in Tunisian time, not UTC
  JAVA_TOOL_OPTIONS: -Duser.timezone=Africa/Tunis

x-cloudinary-env: &cloudinary-env
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-ddbunaglw}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-915436136837845}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-FMD_RxeZiE1NMUCeMWz5XcVizDw}

x-spring-depends: &spring-depends
  config-server:
    condition: service_healthy
  discovery-service:
    condition: service_healthy

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  mongodb:
    image: mongo:6
    ports:
      - "27018:27017"   # host 27017 is used by the eidos project
    volumes:
      - mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=tourism
      - MONGO_INITDB_ROOT_PASSWORD=tourism
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    restart: unless-stopped
    ports:
      - "9999:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /
      # Always issue tokens as localhost:9999, even when a container calls
      # keycloak:8080, so the browser and the services agree on the issuer.
      KC_HOSTNAME_URL: http://localhost:9999
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    # Imports keycloak/hotel-realm.json on first start (skipped if the realm exists)
    command: start-dev --import-realm
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
      # Hotel-branded login, sign-up and password pages
      - ./keycloak/themes/royal-tulip:/opt/keycloak/themes/royal-tulip:ro
    networks:
      - hotel_net

  zipkin:
    image: openzipkin/zipkin:latest
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - hotel_net

  # Catches every e-mail sent in development (account verification, ...): http://localhost:8026
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8026:8025"     # web inbox (8025 is used by the eidos project)
      - "1026:1025"     # SMTP (1025 is used by the eidos project)
    networks:
      - hotel_net

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5673:5672"     # host 5672 is used by the eidos project
      - "15673:15672"   # host 15672 is used by the eidos project
    environment:
      RABBITMQ_DEFAULT_USER: hotel
      RABBITMQ_DEFAULT_PASS: hotel
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s   # first start after a reboot can take over a minute
    networks:
      - hotel_net

  # ─── Spring Cloud backbone (must start before business services) ──────────

  config-server:
    build: ./services/config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: -Duser.timezone=Africa/Tunis
    networks:
      - hotel_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  discovery-service:
    build: ./services/discovery-service
    restart: unless-stopped
    ports:
      - "8889:8889"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      JAVA_TOOL_OPTIONS: -Duser.timezone=Africa/Tunis
    networks:
      - hotel_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8889/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build: ./services/api-gateway
    restart: unless-stopped
    ports:
      - "8180:8080"     # host 8080 is taken by Jenkins (WSL)
    depends_on:
      <<: *spring-depends
      keycloak:
        condition: service_started
    environment:
      <<: *spring-env
    networks:
      - hotel_net

  # ─── Business services ────────────────────────────────────────────────────

  chambre-service:
    build: ./services/chambre-service
    restart: unless-stopped
    ports:
      - "8091:8081"     # host 8081 is used by the eidos project
    depends_on: *spring-depends
    volumes:
      - chambre-data:/data
    environment:
      <<: [*spring-env, *cloudinary-env]
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/chambredb
      # Also set here so the service starts even if the config server is not ready yet
      SPRING_DATASOURCE_USERNAME: sa
    networks:
      - hotel_net

  stock-service:
    build: ./services/stock-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on: *spring-depends
    volumes:
      - stock-data:/data
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/stockdb
    networks:
      - hotel_net

  reservation-service:
    build: ./services/reservation-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      <<: *spring-depends
      chambre-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - reservation-data:/data
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/reservationdb
      # Service account used for calls to chambre-service and payment-service
      SERVICE_AUTH_TOKEN_URI: http://keycloak:8080/realms/hotel/protocol/openid-connect/token
      SERVICE_AUTH_CLIENT_SECRET: ${RESERVATION_SERVICE_SECRET:-7cc8fef7d6519c8c6c91f95f1b3a08c14016fbc28d4f568f}
      RABBITMQ_HOST: rabbitmq
      # Booking e-mails go to Mailpit (http://localhost:8026) unless a real SMTP server is set in .env
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    networks:
      - hotel_net

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    ports:
      - "3001:3000"     # host 3000 is used by the eidos project
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      MONGO_URI: mongodb://tourism:tourism@mongodb:27017/hotel-users?authSource=admin
      KEYCLOAK_URL: http://keycloak:8080/realms/hotel
      # Service account used to update a user's own name/e-mail in Keycloak
      KEYCLOAK_ADMIN_CLIENT_ID: user-service-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${USER_SERVICE_ADMIN_SECRET:-b58186451f65d18332e0ab890f1573fa70a3e81403b60413}
      APP_URL: http://localhost:5173/dashboard/profil
      EUREKA_HOST: discovery-service
      EUREKA_PORT: "8889"
      # Name the gateway uses to reach this container on the Docker network
      HOST: user-service
    networks:
      - hotel_net

  client-service:
    build: ./services/client-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    depends_on:
      <<: *spring-depends
      keycloak:
        condition: service_started
    volumes:
      - client-data:/data
    environment:
      <<: [*spring-env, *cloudinary-env]
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/clientdb
      # Also set here so the service starts even if the config server is not ready yet
      SPRING_DATASOURCE_USERNAME: sa
    networks:
      - hotel_net

  payment-service:
    build: ./services/payment-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    depends_on: *spring-depends
    volumes:
      - payment-data:/data
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/paymentdb
      # Online payment (Konnect) stays off until the keys are set in .env (see .env.example)
      KONNECT_API_KEY: ${KONNECT_API_KEY:-}
      KONNECT_WALLET_ID: ${KONNECT_WALLET_ID:-}
      KONNECT_BASE_URL: ${KONNECT_BASE_URL:-https://api.sandbox.konnect.network/api/v2}
      KONNECT_RETURN_URL: ${KONNECT_RETURN_URL:-http://localhost:5173/dashboard/mes-reservations}
      KONNECT_WEBHOOK_URL: ${KONNECT_WEBHOOK_URL:-}
      KONNECT_MODE: ${KONNECT_MODE:-live}
    networks:
      - hotel_net

  rh-service:
    build: ./services/rh-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    depends_on: *spring-depends
    volumes:
      - rh-data:/data
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/rhdb
    networks:
      - hotel_net

  # ─── Frontend ─────────────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - hotel_net

networks:
  hotel_net:
    name: hotel_net
    driver: bridge

volumes:
  mongo:
  keycloak-data:
  chambre-data:
  stock-data:
  reservation-data:
  client-data:
  payment-data:
  rh-data:
